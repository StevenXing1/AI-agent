<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Customer Service Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-one"></div>
    <div class="bg-shape bg-two"></div>

    <main class="layout">
      <section class="panel hero">
        <p class="kicker">AI CUSTOMER CARE</p>
        <h1>AI Support Hub</h1>
        <p>
          Fine-tuned open-source models + SQLite knowledge base for a continuously improving customer service QA system.
        </p>
        <div id="stats" class="stats">Loading...</div>
      </section>

      <section class="panel chat-panel">
        <div class="chat-header">Live Chat</div>
        <div id="chatBox" class="chat-box"></div>
        <form id="chatForm" class="chat-form">
          <input
            id="messageInput"
            type="text"
            placeholder="e.g. When will my order be shipped?"
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>

      <section class="panel admin-panel">
        <div class="chat-header">Knowledge Base</div>
        <form id="qaForm" class="stack-form">
          <input id="qInput" type="text" placeholder="Question" required />
          <textarea id="aInput" placeholder="Answer" required></textarea>
          <button type="submit">Add Q&amp;A</button>
        </form>

        <div class="admin-actions">
          <input id="csvFile" type="file" accept=".csv" />
          <button id="uploadBtn" type="button">Upload CSV</button>
          <button id="reloadBtn" type="button">Reload Model</button>
        </div>

        <div id="adminTip" class="admin-tip"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
